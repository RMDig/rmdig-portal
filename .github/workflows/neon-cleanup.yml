# Deletes a PR's disposable Neon branch when the PR closes (merged or not).
#
# The e2e job forks a branch per PR (e2e-ci-pr-<number>) and deletes it
# itself, but not if the job died mid-run; orphans fill the project's branch
# quota and break the e2e gate. This makes the cleanup deterministic.
#
# Vercel previews no longer get per-PR branches in this project: since #91
# they use the separate rmdig-portal-preview project's shared `preview`
# branch, so there are no preview/<git-branch> branches here to delete.
name: Neon e2e branch cleanup

on:
  pull_request:
    types: [closed]

# Talks only to Neon (with its own key); the workflow token needs nothing.
permissions: {}

jobs:
  delete-e2e-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete this PR's e2e branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          npm install -g neonctl >/dev/null 2>&1
          # Usually already gone (the e2e job deletes its own branch), so a
          # missing branch is fine and never fails the workflow.
          b="e2e-ci-pr-${PR_NUMBER}"
          if neonctl branches delete "$b" --project-id "$NEON_PROJECT_ID" 2>/dev/null; then
            echo "deleted: $b"
          else
            echo "not present (ok): $b"
          fi
