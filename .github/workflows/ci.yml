name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege for the workflow token: every job only reads the repo. A job
# that needs more must say so in its own `permissions:` block. Third-party
# actions are pinned to commit SHAs (tag in the trailing comment) so a moved or
# compromised tag can't change what runs with our secrets.
permissions:
  contents: read

# Cancel older runs on the same ref (PR pushes). Don't cancel on main pushes —
# we want every merge build to complete so Vercel and CI agree.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Reads the packageManager field in package.json so the version matches
      # what we use locally (pnpm 11.1.2). No version drift between dev and CI.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Node 22 LTS — pnpm 11 requires Node 22+. The CLAUDE_BOOTSTRAP.md
      # spec of "Node 20 LTS" predates Node 20's EOL; treat 22 as the new
      # baseline. Local dev tested on 25.x as well.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The vitest suite (pure: no DB, no network; CLAUDE.md §4.3), including
      # the §0 public-copy scan and the compliance-copy twin pins. Stays inside
      # this job so its required-check name doesn't change.
      - name: Unit tests
        run: pnpm test

      # docs/plans/31 §6: the pinned AvAI user agreement (text, assent line,
      # attestations) must match what AvServ publishes. PR mode fails on any
      # mismatch; an unreachable AvServ or a newly published, not-yet-pinned
      # version only warns here (the daily agreement-pin.yml run fails on them).
      - name: Agreement pin check
        run: pnpm agreement:check --mode pr
        env:
          AGREEMENT_CHECK_NODES: https://avserv-2.rmdig.ai,https://avserv-3.rmdig.ai

      # Build catches errors typecheck and lint miss (RSC boundary violations,
      # client/server import mistakes, Sentry build hook regressions). No env
      # vars needed yet — lib/db/index.ts isn't imported by any route in P1.0,
      # so DATABASE_URL absence doesn't fail the build. Revisit when P1.1 adds
      # routes that import the db client.
      - name: Build
        run: pnpm build

  migration-guard:
    name: Migrations applied to production
    # CLAUDE.md §3.8, docs/runbook.md "Migration guard": Vercel deploys main on
    # merge, so a PR must not merge ahead of its schema. Fails while this
    # branch has a migration production hasn't applied; re-run it after
    # `pnpm db:migrate` against prod. Read-only: the secret is a role that can
    # SELECT drizzle.__drizzle_migrations and nothing else.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The guard diffs against the PR base to see whether it touches
          # lib/db/migrations/.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production has this branch's migrations
        run: pnpm migrations:check-prod --base ${{ github.event.pull_request.base.sha }}
        env:
          PROD_MIGRATIONS_READ_URL: ${{ secrets.PROD_MIGRATIONS_READ_URL }}

  e2e-gate:
    name: Device-link E2E (mock)
    # The bootstrap §6 gate for P1.3: drives a real browser through credentials
    # login → AvServ account map (P-B1) → linked-devices view (P-B3) → mint a
    # link-code (P-B2), against the hermetic mock AvServ. PRs only — a merge to
    # main has already passed this on its PR, so we don't re-run (or spin up a
    # Neon branch) on every push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      # Ephemeral DB: branch off the dev branch (NOT production — so CI never
      # clones real user data). Created here, torn down in the final step
      # regardless of outcome. db_url_with_pooler is the pooled connection string.
      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@34f619c41c6e67b4f2f13f1c6eae90827a5f2cf4 # v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          parent: ${{ vars.NEON_PARENT_BRANCH || 'vercel-dev' }}
          branch_name: e2e-ci-pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # Idempotent catch-up in case the dev parent lagged behind main's migrations.
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}

      - name: Run device-link mock gate
        run: pnpm test:e2e
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          # Explicit acknowledgement that this DB is disposable (global-setup
          # writes to the users table and refuses to run without it).
          E2E_ALLOW_DB: "1"
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          # Unused by the credentials flow the gate exercises, but constructed
          # eagerly at module load, so they must be present (non-empty) or the
          # login request 500s: the Google provider (lib/auth) and the Resend
          # client (lib/email/send.ts, imported by the sign-in action). lib/env
          # skips validation under CI=1 (set automatically by GitHub Actions), so
          # placeholders suffice. AVSERV_BASE_URL is left unset → harness mock.
          GOOGLE_CLIENT_ID: ci-unused
          GOOGLE_CLIENT_SECRET: ci-unused
          RESEND_API_KEY: re_ci_unused

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Always delete the ephemeral branch — even if the gate failed — so we
      # don't accumulate per-PR branches in the Neon project.
      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: e2e-ci-pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
