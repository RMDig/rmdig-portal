name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older runs on the same ref (PR pushes). Don't cancel on main pushes —
# we want every merge build to complete so Vercel and CI agree.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the packageManager field in package.json so the version matches
      # what we use locally (pnpm 11.1.2). No version drift between dev and CI.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Build catches errors typecheck and lint miss (RSC boundary violations,
      # client/server import mistakes, Sentry build hook regressions). No env
      # vars needed yet — lib/db/index.ts isn't imported by any route in P1.0,
      # so DATABASE_URL absence doesn't fail the build. Revisit when P1.1 adds
      # routes that import the db client.
      - name: Build
        run: pnpm build
