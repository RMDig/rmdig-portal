name: Agreement pin

# docs/plans/31 §6, daily mode: notice when AvServ publishes a new AvAI user
# agreement version (or retires the pinned one) even when no PR is open. A
# superseded version stays accepted for at least 30 days (AvServ contract
# account_agreement.md §2), so a daily failure leaves ample time to run
# `pnpm agreement:pin <version>` and ship. Unlike the PR step in ci.yml, an
# unreachable AvServ fails here too.

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

# Reads the repo only; actions are pinned to commit SHAs (see ci.yml).
permissions:
  contents: read

jobs:
  check:
    name: Pinned agreement matches AvServ
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Agreement pin check (daily)
        run: pnpm agreement:check --mode daily
        env:
          AGREEMENT_CHECK_NODES: https://avserv-2.rmdig.ai,https://avserv-3.rmdig.ai
